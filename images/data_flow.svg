<svg viewBox="0 0 680 160" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>資料流動四步驟</title>
  <desc>JSON、Excel 或資料庫原始資料進入 Data Lake，再到 Power BI，最後輸出報表。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="20" y="50" width="130" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="85" y="75" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">原始數據</text>
  <text x="85" y="95" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">JSON / Excel / DB</text>
  <rect x="190" y="50" width="130" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="255" y="75" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Data Lake</text>
  <text x="255" y="95" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">儲存與清理</text>
  <rect x="360" y="50" width="130" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="425" y="75" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Power BI</text>
  <text x="425" y="95" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">建模與分析</text>
  <rect x="530" y="50" width="130" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="595" y="75" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">成果輸出</text>
  <text x="595" y="95" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">報表 / 儀表板</text>
  <line x1="151" y1="80" x2="188" y2="80" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="321" y1="80" x2="358" y2="80" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="491" y1="80" x2="528" y2="80" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
